[project]
name = "ctok"
version = "0.1.0"
description = "Offline reconstruction of Claude's tokenizer token counts"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: Linguistic",
]

[project.scripts]
ctok = "ctok.main:main"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ctok"]

[tool.pytest.ini_options]
testpaths = ["tests"]
