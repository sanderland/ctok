[project]
name = "ctok"
version = "0.1.0"
description = "Offline reconstruction of Claude's tokenizer token counts"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: Linguistic",
]

[project.scripts]
ctok = "ctok.main:main"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-xdist>=3.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ctok"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The gates replay four corpora over two families; each (corpus, family) case is independent and
# expensive, so distribute per TEST rather than per module — the default `--dist load` does that,
# where `loadscope` would pin both families of a corpus to one worker. Each worker pays the
# vocabulary load once. `-n auto` uses the runner's core count and costs nothing on one core.
addopts = "-n auto"
