[project]
name = "ctok"
version = "1.1.0"
description = "Offline reconstruction of Claude's tokenizer token counts"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = []
authors = [
    { name = "Sander Land" },
]
keywords = ["claude", "tokenizer", "token-count", "anthropic", "nlp"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Linguistic",
]

[project.urls]
Repository = "https://github.com/sanderland/ctok"
Issues = "https://github.com/sanderland/ctok/issues"
Research = "https://tokencontributions.substack.com/p/on-the-biology-of-claudes-tokenizer"

[project.scripts]
ctok = "ctok.main:main"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-xdist>=3.6",
    "tabulate>=0.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ctok"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The corpus gates are expensive and independent per (corpus, family) case, so distribute per test
# (the default `--dist load`); `loadscope` would pin both families of a corpus to one worker.
addopts = "-n auto"
